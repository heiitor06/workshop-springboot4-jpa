<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>UserHub | Gerenciamento de Usuários</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page-container">

    <section class="hero">
        <div class="hero-content">
            <span class="tag">Painel Administrativo</span>
            <h1>UserHub</h1>
            <p>
                Gerencie usuários de forma simples, moderna e eficiente em uma interface
                conectada ao seu backend Java Spring Boot.
            </p>
        </div>

        <div class="hero-card">
            <div class="status-dot"></div>
            <span>Sistema Online</span>
        </div>
    </section>

    <section class="dashboard">

        <div class="form-card">
            <div class="card-header">
                <div>
                    <span class="section-label">Cadastro</span>
                    <h2>Novo Usuário</h2>
                </div>
                <div class="icon-box">+</div>
            </div>

            <form>
                <input type="hidden" id="user-id">

                <div class="input-group">
                    <label for="name">Nome completo</label>
                    <input type="text" id="name" placeholder="Ex: Carlos Heitor">
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Ex: carlos@email.com">
                </div>

                <div class="input-group">
                    <label for="phone">Telefone</label>
                    <input type="text" id="phone" placeholder="Ex: 98999999999">
                </div>

                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite uma senha">
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-primary" onclick="salvarUsuario()">
                        Salvar Usuário
                    </button>

                    <button type="button" class="btn btn-secondary" onclick="limparFormulario()">
                        Limpar
                    </button>
                </div>
            </form>
        </div>

        <div class="table-card">
            <div class="card-header table-header">
                <div>
                    <span class="section-label">Usuários</span>
                    <h2>Lista de Cadastros</h2>
                </div>

                <div class="counter-box">
                    <span id="contador-usuarios">00</span>
                    <small>registros</small>
                </div>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Usuário</th>
                        <th>E-mail</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                    </thead>

                    <tbody id="tabela-usuarios">
                    </tbody>
                </table>
            </div>
        </div>

    </section>

</main>

<script src="script.js"></script>
</body>
</html>
